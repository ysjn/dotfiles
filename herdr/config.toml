onboarding = false

[keys]
# general
prefix = "ctrl+k"
new_workspace = "prefix+c"
copy_mode = ["prefix+[", "prefix+V"]
split_horizontal = "prefix+h"
focus_agent = "prefix+1..9"

# navigation
previous_workspace = "prefix+shift+p"
next_workspace = "prefix+shift+n"
previous_agent = "prefix+p"
next_agent = "prefix+n"
navigate_workspace_up = ["up", "k", "ctrl+p"]
navigate_workspace_down = ["down", "j", "ctrl+n"]

# disable tabs
new_tab = ""
previous_tab = ""
next_tab = ""
rename_tab = ""
move_tab_previous = ""
move_tab_next = ""
switch_tab = ""
close_tab = ""

# panes and workspaces
focus_pane_left = ""
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""
rename_pane = ""
rename_workspace = ""

goto = ""

[[keys.command]]
key = "prefix+g"
type = "plugin_action"
command = "herdr-bar.open"
description = "command bar"

[[keys.command]]
key = "prefix+k"
type = "plugin_action"
command = "attention.jump.next"
description = "jump to next agent needing attention"

[[keys.command]]
key = "prefix+E"
type = "plugin_action"
command = "shibayu36.equalize-panes.equalize"
description = "equalize panes"

[[keys.command]]
key = "prefix+ctrl+p"
type = "plugin_action"
command = "ray.plugin-manager.open"
description = "open plugin manager"

[[keys.command]]
key = "alt+h"
type = "plugin_action"
command = "herdr-splits.nav-left"

[[keys.command]]
key = "alt+j"
type = "plugin_action"
command = "herdr-splits.nav-down"

[[keys.command]]
key = "alt+k"
type = "plugin_action"
command = "herdr-splits.nav-up"

[[keys.command]]
key = "alt+l"
type = "plugin_action"
command = "herdr-splits.nav-right"

[[keys.command]]
type = "plugin_action"
key = "alt+H"
command = "herdr-splits.resize-left"

[[keys.command]]
key = "alt+J"
type = "plugin_action"
command = "herdr-splits.resize-down"

[[keys.command]]
key = "alt+K"
type = "plugin_action"
command = "herdr-splits.resize-up"

[[keys.command]]
key = "alt+L"
type = "plugin_action"
command = "herdr-splits.resize-right"

[ui]
hide_tab_bar_when_single_tab = true
toast.delivery = 'system'
status_indicators = "symbols"

[theme]
name = "kanagawa"
