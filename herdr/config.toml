onboarding = false

[keys]
prefix = "ctrl+k"
split_horizontal = "prefix+h"
detach = "prefix+d"
focus_pane_left = ""
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""
swap_pane_left = ""
swap_pane_down = ""
swap_pane_up = ""
swap_pane_right = "prefix+W"

[[keys.command]]
key = "alt+h"
type = "plugin_action"
command = "herdr-splits.nav-left"

[[keys.command]]
key = "alt+j"
type = "plugin_action"
command = "herdr-splits.nav-down"

[[keys.command]]
key = "alt+k"
type = "plugin_action"
command = "herdr-splits.nav-up"

[[keys.command]]
key = "alt+l"
type = "plugin_action"
command = "herdr-splits.nav-right"

[[keys.command]]
type = "plugin_action"
key = "alt+H"
command = "herdr-splits.resize-left"

[[keys.command]]
key = "alt+J"
type = "plugin_action"
command = "herdr-splits.resize-down"

[[keys.command]]
key = "alt+K"
type = "plugin_action"
command = "herdr-splits.resize-up"

[[keys.command]]
key = "alt+L"
type = "plugin_action"
command = "herdr-splits.resize-right"
